---
- name: Fetch organization networks (all)
  when: test_network_id | default('') | length == 0 and test_network_tag | default('') | length == 0
  cisco.meraki.networks_info:
    organizationId: "{{ test_org_id }}"
  register: org_networks_all

- name: Fetch organization networks filtered by tag
  when: test_network_id | default('') | length == 0 and test_network_tag | default('') | length > 0
  cisco.meraki.networks_info:
    organizationId: "{{ test_org_id }}"
    tags:
      - "{{ test_network_tag }}"
    tagsFilterType: withAnyTags
  register: org_networks_tagged

- name: Fetch organization networks for explicit id lookup
  when: test_network_id | default('') | length > 0
  cisco.meraki.networks_info:
    organizationId: "{{ test_org_id }}"
  register: org_networks_by_id

- name: Select candidate network list
  ansible.builtin.set_fact:
    candidate_networks: >-
      {{
        org_networks_by_id.meraki_response
        | selectattr('id', 'equalto', test_network_id)
        | list
        if (test_network_id | default('') | length > 0)
        else (
          org_networks_tagged.meraki_response
          if (test_network_tag | default('') | length > 0)
          else org_networks_all.meraki_response
        )
      }}

- name: Fail when no network selection criteria provided
  ansible.builtin.fail:
    msg: >-
      Provide test_network_id or test_network_tag. Networks in org {{ test_org_id }}:
      {% for n in org_networks_all.meraki_response %}
      - {{ n.name }} ({{ n.id }}) tags={{ n.tags | default([]) }}
      {% endfor %}
  when:
    - test_network_id | default('') | length == 0
    - test_network_tag | default('') | length == 0

- name: Fail when explicit network id not found
  ansible.builtin.fail:
    msg: "Network id {{ test_network_id }} not found in organization {{ test_org_id }}"
  when:
    - test_network_id | default('') | length > 0
    - candidate_networks | length == 0

- name: Fail when multiple networks match tag
  ansible.builtin.fail:
    msg: >-
      Tag '{{ test_network_tag }}' matched {{ candidate_networks | length }} networks.
      Provide test_network_id. Matches: {{ candidate_networks | map(attribute='name') | list }}
  when:
    - test_network_id | default('') | length == 0
    - test_network_tag | default('') | length > 0
    - candidate_networks | length > 1

- name: Fail when no networks available to list
  ansible.builtin.fail:
    msg: >-
      No networks found in organization {{ test_org_id }}.
      Available: {{ candidate_networks | default([]) | map(attribute='name') | list }}
  when: candidate_networks | default([]) | length == 0

- name: Set selected network facts
  ansible.builtin.set_fact:
    test_network_id: "{{ candidate_networks[0].id }}"
    test_network_name: "{{ candidate_networks[0].name }}"
    test_network_tags: "{{ candidate_networks[0].tags | default([]) }}"
