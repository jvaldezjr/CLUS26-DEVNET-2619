[defaults]
# Semaphore runners often lack a writable home directory for Ansible's default tmp paths.
remote_tmp = /tmp/.ansible-${USER}/remote
local_tmp = /tmp/.ansible-${USER}/local
retry_files_enabled = False
host_key_checking = False
collections_paths = ./collections:~/.ansible/collections:/usr/share/ansible/collections

[privilege_escalation]
become = False
